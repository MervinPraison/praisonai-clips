# Dropped: Theme overrides in docs/overrides are not copied
schemaVersion: 1
site:
  title: PraisonAI Clips
  ui: shadcn
  theme:
    preset: paper
    radius: md
    mode: system
  description: Create reviewed vertical clips from long videos.
seo:
  siteUrl: https://clips.praison.ai
navigation:
  tabs:
  - tab: Docs
    groups:
    - group: Get started
      pages:
      - index
      - product
      - built-with-codex
      icon: rocket
    - group: Get started
      pages:
      - getting-started/installation
      - getting-started/quickstart
      icon: rocket
      prefix: getting-started
    - group: Workflow
      pages:
      - guides/workflow
      - reference/configuration
      - reference/cli
      icon: book-open
    - group: Editors
      pages:
      - editors/index
      - KDENLIVE_LIVE_CONTROL
      - KDENLIVE_MCP_HANDOVER
      - RESOLVE_LIVE_CONTROL
      - editors/resolve-runbook
      icon: book-open
    - group: Contribute
      pages:
      - reference/resolve-sdk
      - reference/documentation
      - reference/validation-report
      - reference/public-release
      icon: book-open
      prefix: reference
navbar:
  primary:
    type: button
    label: Quick start
    href: /docs/getting-started/installation
footer:
  socials:
    github: https://github.com/MervinPraison/praisonai-clips
search:
  enabled: true
  provider: fusejs
content:
  docs:
    dir: docs
    include:
    - '**/*.md'
    - '**/*.mdx'
    nav:
      mode: manual
    exclude:
    - SHORTS_STUDIO.md
    - assets/fonts/README.md
    - assets/demo/README.md
templates:
  docs:
    layout: ThreeColumnLayout
    slots:
      header:
        ref: header_main
      left:
        ref: sidebar_docs
      main:
        type: DocContent
      footer:
        ref: footer_main
components:
  header_main:
    type: Header
    props:
      logoText: PraisonAI Clips
  footer_main:
    type: Footer
    props:
      text: © 2026 Mervin Praison. All rights reserved.
  sidebar_docs:
    type: DocsSidebar
    props:
      source: docs-nav
routes:
- match: /docs/**
  template: docs
