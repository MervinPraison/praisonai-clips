# Generated by praisonaiui.mkdocs_import from mkdocs.yml.
# The MkDocs file is left unchanged. aiui build reads this file.
# Dropped: MkDocs hooks are not run
# Dropped: watch paths are not copied
# Dropped: extra_css is not copied
# Dropped: Theme overrides in docs/overrides are not copied
schemaVersion: 1
site:
  title: PraisonAI Clips
  ui: shadcn
  theme:
    preset: zinc
    darkMode: true
  description: Create reviewed vertical clips from long videos.
seo:
  siteUrl: https://clips.praison.ai
navigation:
  tabs:
  - tab: Home
    groups:
    - group: Home
      pages:
      - index
  - tab: Product
    groups:
    - group: Product
      pages:
      - product
  - tab: Built with Codex
    groups:
    - group: Built with Codex
      pages:
      - built-with-codex
  - tab: Get started
    groups:
    - group: Get started
      pages:
      - getting-started/installation
      - getting-started/quickstart
      prefix: getting-started
  - tab: Workflow
    groups:
    - group: Workflow
      pages:
      - guides/workflow
      - reference/configuration
      - reference/cli
  - tab: Editors
    groups:
    - group: Editors
      pages:
      - editors/index
      - KDENLIVE_LIVE_CONTROL
      - KDENLIVE_MCP_HANDOVER
      - RESOLVE_LIVE_CONTROL
      - editors/resolve-runbook
  - tab: Contribute
    groups:
    - group: Contribute
      pages:
      - reference/resolve-sdk
      - reference/documentation
      - reference/validation-report
      - reference/public-release
      prefix: reference
footer:
  socials:
    github: https://github.com/MervinPraison/praisonai-clips
search:
  enabled: true
  provider: fusejs
content:
  docs:
    dir: docs
    include:
    - '**/*.md'
    - '**/*.mdx'
    exclude:
    - SHORTS_STUDIO.md
    - assets/fonts/README.md
    - assets/demo/README.md
templates:
  docs:
    layout: ThreeColumnLayout
    slots:
      header:
        ref: header_main
      left:
        ref: sidebar_docs
      main:
        type: DocContent
      footer:
        ref: footer_main
components:
  header_main:
    type: Header
    props:
      logoText: PraisonAI Clips
  footer_main:
    type: Footer
    props:
      text: © 2026 Mervin Praison. All rights reserved.
  sidebar_docs:
    type: DocsSidebar
    props:
      source: docs-nav
routes:
- match: /docs/**
  template: docs
