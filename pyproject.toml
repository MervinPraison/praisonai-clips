[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "praisonai-clips"
version = "0.1.2"
description = "Turn long videos into captioned vertical clips and edit them live in DaVinci Resolve or Kdenlive with Codex."
readme = "docs/pypi.md"
requires-python = ">=3.11"
authors = [{name = "Mervin Praison"}]
dependencies = ["openai>=2.54,<3", "pydantic>=2,<3", "python-dotenv>=1,<2", "streamlit>=1.40,<2", "pandas>=2,<4", "PyYAML>=6,<7"]

[project.urls]
Homepage = "https://clips.praison.ai/"
Documentation = "https://clips.praison.ai/getting-started/installation/"
Repository = "https://github.com/MervinPraison/praisonai-clips"

[project.optional-dependencies]
studio = []
dev = ["pytest>=8,<10"]
live = ["mcp>=1,<2"]
docs = ["mkdocs-material>=9.6,<10"]

[project.scripts]
praisonai-clips = "praisonai_shorts_studio.cli:main"
praisonai-shorts-studio = "praisonai_shorts_studio.cli:main"
praisonai-resolve = "praisonai_shorts_studio.live.cli:main"
praisonai-resolve-mcp = "praisonai_shorts_studio.live.mcp:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.setuptools.package-data]
"praisonai_shorts_studio.live.resources" = ["*.lua", "*.applescript", "*.txt"]

"praisonai_shorts_studio" = ["resources/demo/*", "resources/studio.css"]
