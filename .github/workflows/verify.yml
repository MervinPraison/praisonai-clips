name: Verify project

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install media tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core
      - name: Install test dependencies
        run: python -m pip install '.[dev,live]'
      - name: Run portable regression suite
        run: pytest -q --junitxml=test-results.xml
      - name: Verify installed CLI outside the checkout
        run: |
          python -m pip wheel . --no-deps --wheel-dir "$RUNNER_TEMP/clips-wheel"
          python -m venv --system-site-packages "$RUNNER_TEMP/clips-install"
          "$RUNNER_TEMP/clips-install/bin/python" -m pip install --no-deps --force-reinstall "$RUNNER_TEMP"/clips-wheel/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/clips-install/bin/praisonai-clips" example --output example.zip
          "$RUNNER_TEMP/clips-install/bin/praisonai-clips" --data-dir cli-data preview
          "$RUNNER_TEMP/clips-install/bin/praisonai-clips" resolve set-framing --help
          "$RUNNER_TEMP/clips-install/bin/praisonai-clips" kdenlive --help
      - name: Summarize checks
        if: always()
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          import xml.etree.ElementTree as ET
          report = Path('test-results.xml')
          if report.exists():
              suites = ET.parse(report).getroot().findall('testsuite')
              totals = {key: sum(int(s.get(key, 0)) for s in suites) for key in ['tests', 'failures', 'errors', 'skipped']}
              passed = totals['tests'] - totals['failures'] - totals['errors'] - totals['skipped']
              with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
                  summary.write(f"## Project verification\n\n{passed} passed; {totals['skipped']} skipped; {totals['failures'] + totals['errors']} failed/errors.\n\n")
                  summary.write('Uses real FFmpeg renders and synthetic API fixtures. No paid OpenAI requests or live desktop edits. Optional runtime tests skip when dependencies are absent.\n')
          PY
