<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 930" role="img" aria-labelledby="title desc">
  <title id="title">Edit in DaVinci Resolve by chatting with Codex</title>
  <desc id="desc">A chat request goes through PraisonAI Clips MCP and SDK identity checks to the open Resolve editor. The result returns to the chat and the person reviews it in Resolve.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#33362e"/></marker>
  </defs>
  <rect width="1000" height="930" fill="#f5f2e9"/>
  <rect x="20" y="20" width="960" height="890" fill="none" stroke="#b8b7ab" stroke-width="2"/>
  <text x="65" y="76" fill="#74756e" font-family="Arial,sans-serif" font-size="21" letter-spacing="2">FROM A CHAT TO A LIVE EDIT</text>
  <text x="65" y="128" fill="#20211e" font-family="Georgia,serif" font-size="42">You ask. Codex edits. You review.</text>
  <line x1="65" y1="158" x2="935" y2="158" stroke="#b8b7ab" stroke-width="2"/>
  <rect x="65" y="193" width="870" height="168" fill="#fffef8" stroke="#b8b7ab" stroke-width="2"/>
  <text x="94" y="235" fill="#74756e" font-family="Arial,sans-serif" font-size="19" letter-spacing="2">01 / YOUR REQUEST IN CODEX</text>
  <rect x="94" y="257" width="810" height="71" rx="9" fill="#e5eddb"/>
  <text x="115" y="303" fill="#20211e" font-family="Arial,sans-serif" font-size="29">“Remove the quiet pauses so I can review.”</text>
  <path d="M500 361V406" fill="none" stroke="#33362e" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="65" y="411" width="870" height="169" fill="#fffef8" stroke="#b8b7ab" stroke-width="2"/>
  <text x="94" y="453" fill="#74756e" font-family="Arial,sans-serif" font-size="19" letter-spacing="2">02 / PRAISONAI CLIPS</text>
  <text x="94" y="498" fill="#20211e" font-family="Georgia,serif" font-size="32">Codex calls the MCP tools and SDK</text>
  <text x="94" y="540" fill="#3c3d38" font-family="Arial,sans-serif" font-size="22">Checks the project and clip · plans the edit · sends the command</text>
  <path d="M500 580V625" fill="none" stroke="#33362e" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="65" y="630" width="870" height="169" fill="#fffef8" stroke="#b8b7ab" stroke-width="2"/>
  <text x="94" y="672" fill="#74756e" font-family="Arial,sans-serif" font-size="19" letter-spacing="2">03 / DAVINCI RESOLVE</text>
  <text x="94" y="717" fill="#20211e" font-family="Georgia,serif" font-size="32">The timeline updates on your screen</text>
  <text x="94" y="759" fill="#3c3d38" font-family="Arial,sans-serif" font-size="22">Review the result in Resolve; Codex reports what happened.</text>
  <line x1="65" y1="840" x2="935" y2="840" stroke="#b8b7ab" stroke-width="2"/>
  <text x="65" y="879" fill="#74756e" font-family="Arial,sans-serif" font-size="19">Tested on macOS · Resolve must be open · You choose what to save</text>
</svg>
